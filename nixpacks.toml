[phases.setup]
nixPkgs = ['go', 'gcc']

[phases.install]
cmds = [
  'go mod download',
  'go install github.com/a-h/templ/cmd/templ@latest'
]

[phases.build]
cmds = [
  '~/go/bin/templ generate ./internal/dashboard/views/',
  'GOOS=linux GOARCH=arm64 CGO_ENABLED=1 go build -o golden-gate ./cmd/main.go'
]

[start]
cmd = './golden-gate'

[variables]
GO_ENV = 'production'
CGO_ENABLED = '1'
GOOS = 'linux'
GOARCH = 'arm64'

[static]
dirs = ["static"] 
